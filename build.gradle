plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'io.lupix.runelite.bankauditor.BankAuditorPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'io.lupix.runelite.bankauditor'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.withType(Test).configureEach {
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
	afterSuite { desc, result ->
		if (!desc.parent) {
			println "Tests: ${result.testCount} run, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
		}
	}
}

// Running the plugin in your own client. RuneLite only reads .runelite/sideloaded-plugins in developer mode,
// and the official launcher always turns developer mode off, so these tasks start the client themselves.

def sideloadedJar = new File(System.getProperty('user.home'), '.runelite/sideloaded-plugins/bank-auditor.jar')
def pluginJar = tasks.named('jar').flatMap { it.archiveFile }

tasks.register('sideload') {
	group = 'runelite'
	description = 'Copies the plugin jar into .runelite/sideloaded-plugins.'
	dependsOn tasks.named('jar')
	doLast {
		sideloadedJar.parentFile.mkdirs()
		java.nio.file.Files.copy(pluginJar.get().asFile.toPath(), sideloadedJar.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		println "Copied the plugin to ${sideloadedJar}"
	}
}

tasks.register('unsideload', Delete) {
	group = 'runelite'
	description = 'Removes the plugin jar from .runelite/sideloaded-plugins.'
	delete sideloadedJar
}

tasks.register('run', JavaExec) {
	group = 'runelite'
	description = 'Sideloads the plugin and starts RuneLite in developer mode. Add -Pprofile=<name> to pick a RuneLite profile.'
	dependsOn 'sideload'
	// The client and its dependencies only, the plugin itself comes from the sideloaded jar
	classpath = configurations.testRuntimeClasspath
	mainClass = 'net.runelite.client.RuneLite'

	jvmArgs '-ea'
	args '--developer-mode'
	if (project.hasProperty('profile')) {
		args '--profile', project.property('profile')
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
